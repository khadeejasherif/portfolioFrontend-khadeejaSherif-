<div class="group relative overflow-hidden rounded-3xl bg-[#131313] border border-neutral-800 text-white shadow-xl transition-all duration-500 hover:-translate-y-2 hover:border-purple-500/30 flex flex-col h-full w-full">
  
  <!-- Image Frame  -->
  <div class="relative overflow-hidden aspect-[4/3] w-full bg-neutral-950 shrink-0">
    @if (project.featured) {
      <span class="absolute top-4 left-4 z-10 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 px-3 py-1 text-xs font-semibold tracking-wide text-white shadow-md">
        Featured
      </span>
    }
    <img [src]="project.imageUrl" [alt]="project.title" class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110" />
    
    <!-- White Overlay Hover -->
    <div class="absolute inset-0 bg-white/95 opacity-0 transition-all duration-300 ease-in-out group-hover:opacity-90 flex flex-col justify-center items-center p-6 text-neutral-900">
      <h4 class="font-bold text-xl tracking-tight text-center translate-y-4 transition-transform duration-300 group-hover:translate-y-0">{{ project.title }}</h4>
      <div class="mt-4 flex items-center gap-3 translate-y-6 transition-transform duration-300 delay-75 group-hover:translate-y-0">
        @if (project.demoUrl) { <a [href]="project.demoUrl" target="_blank" class="rounded-full bg-gradient-to-r from-purple-600 to-pink-600 px-5 py-2 text-xs font-bold text-white transition-transform hover:scale-105">Live Demo</a> }
        @if (project.githubUrl) { <a [href]="project.githubUrl" target="_blank" class="rounded-full border-2 border-neutral-900 bg-transparent px-5 py-2 text-xs font-bold text-neutral-900 transition-colors hover:bg-neutral-900 hover:text-white">Code</a> }
      </div>
    </div>
  </div>

  <!-- Details Content Area -->
  <div class="p-6 flex flex-col flex-grow justify-between">
    <div>
      <h3 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-neutral-400 bg-clip-text text-transparent group-hover:from-purple-400 group-hover:to-pink-400 transition-all duration-300 min-h-[56px] line-clamp-2">
        {{ project.title }}
      </h3>
      
      <!-- description-->
      <p class="mt-2 text-sm text-neutral-400 line-clamp-3 leading-relaxed">
        {{ project.description }}
      </p>
    </div>

    <!-- Tags -->
    @if (project.tags && project.tags.length > 0) {
      <div class="mt-6 flex flex-wrap gap-1.5 pt-4 border-t border-neutral-800/50">
        @for (tag of project.tags; track tag) {
          <span class="rounded-full bg-neutral-800/60 px-2.5 py-0.5 text-xs font-medium text-neutral-300 border border-neutral-700/30">
            {{ tag }}
          </span>
        }
      </div>
    }
  </div>
</div>
