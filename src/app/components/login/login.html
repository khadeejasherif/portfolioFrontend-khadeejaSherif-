<div class="relative w-full min-h-screen flex items-center justify-center px-6 bg-[#0c0c0c] text-white overflow-hidden">
  <div class="absolute w-[500px] h-[500px] bg-[#a855f7]/5 blur-[150px] rounded-full top-1/4 left-1/4 pointer-events-none"></div>

  <div class="w-full max-w-md p-8 rounded-3xl border border-white/5 bg-[#121212]/40 backdrop-blur-3xl shadow-[0_24px_50px_rgba(0,0,0,0.6)] z-10 space-y-6">
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-black uppercase tracking-tight">Welcome Back</h2>
      <p class="text-xs text-neutral-400 font-light">Sign in to manage your environment dashboard.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="loginFunc()" class="space-y-4">
      
      <div class="space-y-1.5">
        <label class="text-[10px] font-bold uppercase tracking-widest text-neutral-400">Email Address</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="developer@example.com"
          class="w-full px-4 py-3 rounded-xl bg-white/[0.02] border border-white/5 text-sm font-light text-white placeholder-neutral-600 focus:outline-none focus:border-[#a855f7]/50 focus:bg-white/[0.04] transition-all duration-300"
        />
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
          <p class="text-[10px] text-red-400 font-mono mt-1">Please enter a valid email address.</p>
        }
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-bold uppercase tracking-widest text-neutral-400">Password</label>
        <input 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl bg-white/[0.02] border border-white/5 text-sm font-light text-white placeholder-neutral-600 focus:outline-none focus:border-[#a855f7]/50 focus:bg-white/[0.04] transition-all duration-300"
        />
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <p class="text-[10px] text-red-400 font-mono mt-1">Password is required.</p>
        }
      </div>

      <div class="pt-2">
        <button 
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full inline-flex items-center justify-center gap-2 px-8 py-4 bg-gradient-to-r from-[#a855f7] to-[#ec4899] text-white font-bold text-xs uppercase tracking-wider rounded-full hover:scale-[1.01] hover:shadow-[0_0_30px_rgba(168,85,247,0.3)] active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100 transition-all duration-300 h-[50px]"
        >
          <span>Sign In</span>
        </button>
      </div>
    </form>
  </div>
</div>
