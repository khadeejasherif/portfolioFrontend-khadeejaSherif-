<div
class="relative w-full min-h-screen lg:-mt-14 lg:pt-12 flex items-center px-6 md:px-16 bg-[#0c0c0c] overflow-hidden text-white lg:pt-0"
style="background-image: radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.08) 0%, transparent 60%), linear-gradient(to right, rgba(255, 255, 255, 0.01) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 1px, transparent 1px); background-size: 100% 100%, 60px 60px, 60px 60px;"
>

<div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-center z-10 py-12 lg:py-0">

<div class="lg:col-span-7 space-y-8 flex flex-col items-start text-left">

<a
routerLink="/projects"
class="group relative inline-flex items-center gap-2.5 px-5 py-2 rounded-full border border-[#a855f7]/30 bg-[#120b1e]/60 text-[10px] font-extrabold uppercase tracking-widest text-[#d8b4fe] hover:border-[#a855f7] hover:shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all duration-300"
>
<span class="w-1.5 h-1.5 rounded-full bg-[#a855f7] animate-pulse"></span>
<span (onclick)="projectFun()">View My Work</span>
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform">
<path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
</svg>
</a>

<div class="space-y-3">
<span class="text-xs font-bold tracking-[0.25em] text-[#a855f7] uppercase block select-none">CREATIVE DEVELOPER</span>
<h1 class="text-5xl sm:text-7xl font-black tracking-tighter uppercase select-none text-white leading-[0.9]">
Frontend
</h1>
<h1 class="text-5xl sm:text-7xl font-black tracking-tighter uppercase select-none bg-gradient-to-r from-[#a855f7] via-[#c084fc] to-[#ec4899] bg-clip-text text-transparent leading-[0.9] drop-shadow-[0_0_40px_rgba(168,85,247,0.25)]">
Developer
</h1>
</div>

<p class="max-w-lg text-neutral-400 text-sm sm:text-base md:text-lg font-light leading-relaxed">
I'm <span class="text-white font-medium">Khadeeja Sherif</span>, a front-end developer passionate about building responsive, user-friendly, and performance-driven websites.
</p>

<div class="flex flex-wrap items-center gap-4 pt-2">
<button
(click)="downloadCv()"
[disabled]="isDownloading"
class="inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-[#a855f7] to-[#ec4899] text-white font-bold text-xs uppercase tracking-wider rounded-full hover:scale-[1.01] hover:shadow-[0_0_30px_rgba(168,85,247,0.3)] active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100 transition-all duration-300 h-[50px] sm:h-auto"
>
@if (isDownloading) {
<span class="w-3.5 h-3.5 rounded-full border-2 border-t-transparent border-white animate-spin"></span>
<span>Downloading...</span>
} @else {
<span>Download CV</span>
<svg
xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="2.5"
stroke="currentColor"
class="w-3.5 h-3.5"
>
<path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
</svg>
}
</button>

<a
routerLink="/contact"
class="inline-flex items-center gap-2 px-8 py-4 border border-white/10 hover:border-white/30 bg-white/[0.02] text-white font-bold text-xs uppercase tracking-wider rounded-full hover:bg-white/5 transition-all duration-300 active:scale-95 h-[50px] sm:h-auto"
>
<span>Get in Touch</span>
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-4.03 9-9s-4.03-9-9-9-9 4.03-9 9 4.03 9 9 9Z" />
<path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75 14.25 12M14.25 12 12 14.25M14.25 12H9.75" />
</svg>
</a>
</div>
</div>



<div class="lg:col-span-5 w-full h-[400px] sm:h-[480px] lg:h-[520px] relative flex justify-center items-center">
  <div class="absolute w-80 h-80 bg-[#a855f7]/15 blur-[120px] rounded-full pointer-events-none z-0"></div>

  <div class="relative w-full h-full flex items-center justify-center">

    <div class="absolute w-72 h-72 sm:w-80 sm:h-80 rounded-full border border-[#a855f7]/15"></div>
    <div class="absolute w-56 h-56 sm:w-64 sm:h-64 rounded-full border border-[#ec4899]/15"></div>

    <div class="relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-gradient-to-br from-[#a855f7] via-[#c084fc] to-[#ec4899] flex items-center justify-center shadow-[0_0_60px_rgba(168,85,247,0.35)] z-10">
      <span class="text-5xl sm:text-6xl font-black text-white tracking-tight select-none">KS</span>
      <span class="absolute bottom-2 right-2 w-5 h-5 rounded-full bg-[#27c93f] border-[3px] border-[#0c0c0c]"></span>
    </div>

    <span class="absolute top-6 left-8 sm:left-4 px-4 py-2 rounded-full border border-white/10 bg-[#120b1e]/80 backdrop-blur-sm text-[10px] font-extrabold uppercase tracking-widest text-[#d8b4fe] shadow-lg">
      Angular
    </span>
    <span class="absolute top-16 right-2 sm:right-0 px-4 py-2 rounded-full border border-white/10 bg-[#120b1e]/80 backdrop-blur-sm text-[10px] font-extrabold uppercase tracking-widest text-[#d8b4fe] shadow-lg">
      TypeScript
    </span>
    <span class="absolute bottom-16 left-2 sm:left-0 px-4 py-2 rounded-full border border-white/10 bg-[#120b1e]/80 backdrop-blur-sm text-[10px] font-extrabold uppercase tracking-widest text-[#d8b4fe] shadow-lg">
      React
    </span>
    <span class="absolute bottom-8 right-8 sm:right-4 px-4 py-2 rounded-full border border-white/10 bg-[#120b1e]/80 backdrop-blur-sm text-[10px] font-extrabold uppercase tracking-widest text-[#d8b4fe] shadow-lg">
      Tailwind
    </span>

  </div>
</div>


</div>

<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-[#ec4899]/5 blur-[120px] pointer-events-none"></div>
</div>
